[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlint"
version = "0.3.0"
description = "Multi-language code quality scanner — complexity, duplication, security, and smells"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pathspec>=0.12"]
keywords = ["code-quality", "static-analysis", "security", "complexity", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "build"]

[project.urls]
Homepage = "https://github.com/ropean/qlint"
Repository = "https://github.com/ropean/qlint"
Issues = "https://github.com/ropean/qlint/issues"

[project.scripts]
qlint = "qlint.cli:main"

[tool.setuptools.packages.find]
include = ["qlint*"]
